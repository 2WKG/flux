name: Static demo

on:
  pull_request:
    paths:
      - "web/**"
      - "data/demo/bundle.json"
      - ".github/workflows/static-demo.yml"
  push:
    branches:
      - master
    paths:
      - "web/**"
      - "data/demo/bundle.json"
      - ".github/workflows/static-demo.yml"

jobs:
  static-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test:static-demo
        working-directory: web
